controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

wheel_velocity_controller:
  ros__parameters:
    joints:
      - Left_wheel_joint
      - Right_wheel_joint
      - Rear_wheel_joint

    command_interfaces:
      - velocity

    state_interfaces:
      - position
      - velocity